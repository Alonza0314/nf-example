name: CI Pipeline for nf-example

on:
  push:
    branches: [ lab7-ci, main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Install dependencies
      run: go mod tidy

    - name: Lint check
      run: |
        go fmt ./...
        echo "✅ Code formatting checked"

    - name: Build project
      run: go build -v ./...

    - name: Run unit tests
      run: go test ./... -v
